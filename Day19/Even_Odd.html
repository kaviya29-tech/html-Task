<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or odd</title>
</head>
<body>


    <script>
        function checkEvenOdd(num){
            if(num%2==0){
                return "Even number";
            }
            else{
                return "odd number";
            }
        }
        console.log(checkEvenOdd(12));
        document.write(checkEvenOdd(12)+'<br>');
        console.log(checkEvenOdd(5));
        document.write(checkEvenOdd(5));
    </script>
</body>
</html>
