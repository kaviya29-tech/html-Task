<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest number</title>
</head>
<body>

    <script>
        function findLargest(a, b, c) {
            if (a >= b && a >= c) {
                return a;
            }
            else if (b >= a && b >= c) {
                return b;
            }
            else {
                return c;
            }
        }

        console.log("Largest:", findLargest(10, 25, 15));
        document.write("Largest:", findLargest(10, 25, 15));
    </script>
</body>
</html>
