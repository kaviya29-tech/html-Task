<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagram</title>
</head>
<body>
    <h2>Anagram/Not</h2>
    <script>
        let string1 = "race";
        let string2 = "care";

        let a = string1.split("").sort().join("");
        let b = string2.split("").sort().join("");

        if (a == b) {
            console.log("Anagram");
            document.write("Anagram");
        }
        else {
            console.log("Not Anagram");
            document.write("Not Anagram");
        }
    </script>
</body>
</html>
