<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse string</title>
</head>
<body>
    <script>
        let string = "kaviya";
        let reverse = "";
        for (let i = string.length - 1; i >= 0; i--) {
            reverse = reverse + string[i];
        }
        console.log(reverse);
        document.write(reverse);
    </script>
</body>
</html>
